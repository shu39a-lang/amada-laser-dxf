name: SHEET MASTER v2.5 build
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - run: bash prepare.sh
      - name: Build Release and verify version in the app
        run: |
          xcodebuild -project build-input/SheetMaster/SheetMaster.xcodeproj -scheme SheetMaster -configuration Release -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/SheetMasterBuild" SM_BUNDLE_ID=com.shu39a.amadaoffline CODE_SIGNING_ALLOWED=NO build
          plist="$RUNNER_TEMP/SheetMasterBuild/Build/Products/Release-iphoneos/SheetMaster.app/Info.plist"
          test "$(plutil -extract CFBundleShortVersionString raw "$plist")" = "2.5"
          test "$(plutil -extract CFBundleIdentifier raw "$plist")" = "com.shu39a.amadaoffline"
