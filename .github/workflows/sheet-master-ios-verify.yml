name: SHEET MASTER iOS build verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  verify-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate backend and run safety regression tests
        run: |
          python -m pip install "fastapi>=0.115,<1" "pydantic>=2,<3"
          python -m compileall -q cloud-recognition
          cd cloud-recognition
          python -m unittest -v test_main.py
  verify-ios:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Validate configuration
        run: |
          set -euo pipefail
          plutil -lint AMADAOffline/Info.plist
          plutil -lint AMADAOffline/GoogleService-Info.plist
          plutil -lint AMADAOffline.xcodeproj/project.pbxproj
          python3 -m py_compile cloud-recognition/main.py
          python3 - <<'PY'
          import plistlib
          from pathlib import Path
          p=plistlib.loads(Path("AMADAOffline/GoogleService-Info.plist").read_bytes())
          assert p["BUNDLE_ID"] == "com.shu39a.amadaoffline"
          assert p["PROJECT_ID"] == "sheet-master-e2aa0"
          assert Path("AMADAOffline/Info.plist").exists()
          view = Path("AMADAOffline/MainView.swift").read_text()
          cloud = Path("AMADAOffline/CloudDrawingRecognition.swift").read_text()
          app = Path("AMADAOffline/AMADAOfflineApp.swift").read_text()
          project = Path("AMADAOffline.xcodeproj/project.pbxproj").read_text()
          assert 'masterRed.ignoresSafeArea()' in view
          assert 'MasterYellowButton' in view
          assert 'CloudDrawingRecognition.analyze(normalized)' in view
          assert 'OfflineVision.analyze(image:normalized)' not in view
          assert 'FirebaseAI.firebaseAI(backend: .googleAI())' in cloud
          assert 'gemini-3.8-flash' in cloud
          assert 'FirebaseApp.configure()' in app
          assert 'FirebaseAILogic' in project and 'FirebaseAppCheck' in project
          print("Firebase AI Logic, Google Gemini, red design, yellow controls and Google-only recognition checked.")
          PY
      - name: Compile iPhone and iPad app without signing
        run: |
          set -euo pipefail
          xcodebuild -project AMADAOffline.xcodeproj -scheme AMADAOffline -configuration Debug -sdk iphonesimulator -destination "generic/platform=iOS Simulator" CODE_SIGNING_ALLOWED=NO build
