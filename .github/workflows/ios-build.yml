name: iOS source build check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  simulator-build:
    runs-on: macos-15
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Show Xcode
        run: xcodebuild -version
      - name: Validate project and privacy metadata
        run: |
          plutil -lint AMADAOffline.xcodeproj/project.pbxproj
          plutil -lint AMADAOffline/Info.plist AMADAOffline/PrivacyInfo.xcprivacy
          icon=AMADAOffline/Assets.xcassets/AppIcon.appiconset/AppIcon-1024.png
          test -s "$icon"
          sips -g pixelWidth "$icon" | grep -q 'pixelWidth: 1024'
          sips -g pixelHeight "$icon" | grep -q 'pixelHeight: 1024'
          xcodebuild -list -project AMADAOffline.xcodeproj
      - name: Test DXF output and export safeguards
        run: |
          swiftc AMADAOffline/Models.swift AMADAOffline/DXF.swift tools/DXFSmokeTest.swift -o /tmp/dxf-smoke-test
          /tmp/dxf-smoke-test
      - name: Compile iOS simulator app without signing
        run: |
          set -o pipefail
          xcodebuild \
            -project AMADAOffline.xcodeproj \
            -scheme AMADAOffline \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
      - name: Verify device Release archive before distribution signing
        run: |
          set -o pipefail
          xcodebuild -project AMADAOffline.xcodeproj -scheme AMADAOffline \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/AMADAOffline.xcarchive" \
            CODE_SIGNING_ALLOWED=NO archive
          app="$RUNNER_TEMP/AMADAOffline.xcarchive/Products/Applications/AMADAOffline.app"
          test -x "$app/AMADAOffline"
          test "$(plutil -extract CFBundleIdentifier raw "$app/Info.plist")" = com.shu39a.amadaoffline
