<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="SHEET MASTER">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#4d0f1e">
<title>SHEET MASTER</title>
<style>
:root{--bg:#4d0f1e;--card:#0a0a0a;--tx:#f4f1ea;--sub:#d9c9cc;--ac:#ffd400;--ac2:#2b2500;--bd:#3d2a30;--warn:#ffb020;--red:#ff4d5e;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 -apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;padding-bottom:96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;padding:10px 16px 6px;border-bottom:3px solid var(--ac)}
.bars{display:flex;gap:5px}.bars i{flex:1;height:5px;border-radius:3px;background:var(--bd)}.bars i.on{background:var(--ac)}
h1{font-size:18px;margin:8px 0 0;color:var(--ac)}
main{padding:8px 16px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin:0 0 12px}
.card h2{font-size:14px;margin:0 0 6px;color:var(--ac)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0}
input[type=text],input[type=number],input[type=password]{font:inherit;color:var(--tx);background:#1c1c1c;border:1px solid var(--bd);border-radius:8px;padding:8px;min-width:0;box-sizing:border-box}
.row input{width:55%;text-align:right}
.holes{display:grid;grid-template-columns:1fr 1fr 1fr 34px;gap:6px;align-items:center;margin-bottom:6px}
.holes input{width:100%}
.holes small{color:var(--sub);font-size:12px}
button{font:inherit;border-radius:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:10px 14px}
button.pri{background:var(--ac);color:#111;border-color:var(--ac);font-weight:600}
button:disabled{opacity:.4}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:#0a0a0a;border-top:3px solid var(--ac);z-index:6}
nav .pri{flex:1}
.sub{color:var(--sub);font-size:13px}.warn{color:var(--warn);font-size:14px;margin:4px 0}
img.pv{width:100%;border-radius:8px;display:block}
.seg{display:flex;gap:6px;margin-bottom:8px}.seg button{flex:1}.seg button.on{background:var(--ac2);border-color:var(--ac);color:var(--ac)}
ol{padding-left:1.4em;margin:8px 0}
.ck{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--bd);cursor:pointer}
.ck input{margin-top:5px;width:20px;height:20px}
pre{overflow-x:auto;background:#000;color:var(--ac);padding:8px;border-radius:8px;font-size:12px;max-height:150px;margin:8px 0}
svg{width:100%;height:auto;display:block}
.bad{background:#a3122a!important;border-color:#ff4d5e!important;border-radius:8px}.row.bad,.holes.bad{padding:6px 8px}
.logo{text-align:center;padding:14px 0 10px}.logo b{display:block;font:900 34px/1.1 "Arial Black",Impact,sans-serif;letter-spacing:.08em;color:var(--ac)}.logo b span{color:#fff}.logo small{display:block;margin-top:6px;color:var(--sub);font-size:14px}
</style>
</head>
<body>
<header><div class="bars"></div><div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h1 id="ttl"></h1><span style="display:flex;gap:6px"><button id="gear" style="padding:6px 10px;font-size:13px">設定</button><button id="rst" style="padding:6px 10px;font-size:13px">最初から</button></span></div></header>
<main id="main"></main>
<nav><button id="back">戻る</button><button id="pri" class="pri"></button></nav>
<div id="cl" hidden style="position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:20;padding-top:env(safe-area-inset-top,0px)"></div>
<div id="st" hidden style="position:fixed;inset:0;background:var(--bg);overflow:auto;z-index:30;padding-top:env(safe-area-inset-top,0px)"></div>
<script>
const TITLES=["① 図面を撮影","② 読み取り結果の確認","③ DXFを作成","④ パソコンへ送る","⑤ 会社PCでの作業"];
const METHODS=[
 {n:"クラウド",s:["前の画面の「保存」を押して、DXFファイルを保存する","保存したファイルを、OneDrive や Googleドライブなどに入れる","会社のパソコンで同じクラウドを開き、ダウンロードする","作業用フォルダ(デスクトップなど)に置く"]},
 {n:"メール",s:["前の画面の「共有」か「保存」で、DXFファイルを作る","そのファイルを、自分宛てのメールに添付して送る(添付できないときは、下の「メールで送る」で本文に入れる)","会社のパソコンで、添付ファイルを保存する","本文に入れて送った場合は、メモ帳に貼り付けて「図番.dxf」(種類:すべてのファイル)で保存する"]},
 {n:"USBケーブル",s:["iPhoneをパソコンにつなぎ、「信頼」を選ぶ","前の画面の「保存」で、iPhoneのファイルに保存する","パソコンの「Appleデバイス」アプリなどから、ファイルを取り出す","作業用フォルダに置く"]}];
const CHECK=["DXFをパソコンの作業フォルダに保存した(拡張子は .dxf)","加工用ソフト(CAM)を起動し、DXFを読み込んだ","単位がmm、原点が左下になっているか確認した","外形と穴の寸法を、図面と照合した","材質と板厚を設定し、加工条件を選んだ","機械用のプログラムを作成した","USBに保存し、機械に入力する前に現場の担当者に確認してもらった"];
const PROMPT=`You are reading a Japanese mechanical drawing of a sheet-metal part.
Return ONLY a JSON object (no markdown) with keys:
partName (string), drawingNo (string), material (string), thickness (number, mm),
width (number, mm, X direction of the plan view), height (number, mm, Y direction of the plan view),
chamfer (number, mm, corner chamfer C value, 0 if none),
holes (array of {"x":number,"y":number,"diameter":number}), notes (string, anything you were unsure about),
xDims (array of numbers: every horizontal position dimension printed on the drawing, measured from the origin, including the overall width),
yDims (same for vertical dimensions, including the overall height).
Rules:
- Origin is the bottom-left corner of the plan-view outline. x and y are hole CENTERS from that origin, in mm.
- Expand quantity notations such as "2-φ6.5" or "5-M3x0.5" into individual holes and locate each one from the dimension lines.
- For tapped holes M3x0.5 use diameter 2.5. For other tapped holes use the standard tap-drill diameter, or 0 if unsure.
- Ignore handwritten red annotations.
- If a value cannot be read, use 0 or an empty string and mention it in notes. Never guess silently.`;
const blank=()=>({partName:"",drawingNo:"",material:"",thickness:0,width:0,height:0,chamfer:0,holes:[],notes:""});
const S={step:0,url:"",blob:null,busy:false,spec:blank(),method:0,checked:{},flags:[],confirmed:false,prog:"",runs:[],cl:{},red:{},redo:{},showCL:false,skipCL:false,showHist:false,showSet:false,fav:{},q:[],reads:[],meta:[],msg:"",abort:null,tier:"quick",t0:0,found:0,tick:null};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const f=v=>String(+(+v).toFixed(4));
const ok=()=>S.spec.width>0&&S.spec.height>0;

function outline(s){const{width:w,height:h,chamfer:c}=s;return c>0?[[c,0],[w-c,0],[w,c],[w,h-c],[w-c,h],[c,h],[0,h-c],[0,c]]:[[0,0],[w,0],[w,h],[0,h]];}
function warnings(){const s=S.spec,w=[...S.flags];
 if(!ok())w.push("外形寸法が未入力です");
 if(s.chamfer>0&&s.chamfer*2>=Math.min(s.width,s.height))w.push("角Cが外形に対して大きすぎます");
 s.holes.forEach((o,i)=>{const n=i+1;if(!(o.diameter>0)){w.push(`穴${n}: 直径が未入力です`);return;}
  if(s.thickness>0&&o.diameter<s.thickness)w.push(`穴${n}: Φ${f(o.diameter)}は板厚${f(s.thickness)}mmより小さく、レーザーでは仕上がりが悪くなる可能性があります。ドリル加工も検討してください`);
  const r=o.diameter/2;if(o.x-r<0||o.y-r<0||o.x+r>s.width||o.y+r>s.height)w.push(`穴${n}: 外形からはみ出しています`);});
 const xd=s.xDims||[],yd=s.yDims||[],has=(a,v)=>a.some(q=>Math.abs(q-v)<0.01);
 if(xd.length){if(s.width>0&&!has(xd,s.width))w.push("(検算) 全幅が、図面の横方向の寸法一覧にありません");s.holes.forEach((o,i)=>{if(!has(xd,o.x))w.push(`(検算) 穴${i+1}: X ${f(o.x)} が、図面の横方向の寸法一覧にありません`);});}
 if(yd.length){if(s.height>0&&!has(yd,s.height))w.push("(検算) 全高が、図面の縦方向の寸法一覧にありません");s.holes.forEach((o,i)=>{if(!has(yd,o.y))w.push(`(検算) 穴${i+1}: Y ${f(o.y)} が、図面の縦方向の寸法一覧にありません`);});}
 return w;}
function dxf(){const s=S.spec,o=["0","SECTION","2","ENTITIES"],p=outline(s),n=v=>(+v).toFixed(4);
 p.forEach((a,i)=>{const b=p[(i+1)%p.length];o.push("0","LINE","8","CUT_OUTLINE","10",n(a[0]),"20",n(a[1]),"30","0.0","11",n(b[0]),"21",n(b[1]),"31","0.0");});
 s.holes.filter(h=>h.diameter>0).forEach(h=>o.push("0","CIRCLE","8","CUT_HOLES","10",n(h.x),"20",n(h.y),"30","0.0","40",n(h.diameter/2)));
 o.push("0","ENDSEC","0","EOF");return o.join("\n")+"\n";}
function fname(){return(S.spec.drawingNo||"part").replace(/[\/\\ ]/g,"-");}
function svg(){const s=S.spec;if(!ok())return'<p class="sub">外形寸法を入れるとプレビューが出ます</p>';
 const p=Math.max(s.width,s.height)*.06,vw=s.width+p*2,vh=s.height+p*2,sw=Math.max(s.width,s.height)/250;
 const pts=outline(s).map(q=>(q[0]+p)+","+(vh-p-q[1])).join(" ");
 let h=`<svg viewBox="0 0 ${vw} ${vh}"><polygon points="${pts}" fill="none" stroke="currentColor" stroke-width="${sw*1.5}"/>`;
 s.holes.forEach(o=>{if(o.diameter>0)h+=`<circle cx="${o.x+p}" cy="${vh-p-o.y}" r="${o.diameter/2}" fill="none" stroke="var(--red)" stroke-width="${sw}"/>`;});
 return h+"</svg>";}
const warnHtml=()=>warnings().map(t=>`<div class="warn">⚠ ${esc(t)}</div>`).join("");

const HK="zm_hist",FK="zm_fav";
function hLoad(){try{return JSON.parse(localStorage.getItem(HK)||"[]");}catch(e){return[];}}
function hStore(a){try{localStorage.setItem(HK,JSON.stringify(a.slice(0,50)));}catch(e){}}
function hSave(){const no=S.spec.drawingNo||"(図番なし)",a=hLoad().filter(x=>x.no!==no);a.unshift({no,name:S.spec.partName,t:Date.now(),spec:S.spec});hStore(a);}
function fLoad(){try{return JSON.parse(localStorage.getItem(FK)||"{}");}catch(e){return{};}}
function fSave(){try{localStorage.setItem(FK,JSON.stringify(S.fav));}catch(e){}}
function drawHist(o){const a=hLoad();
 o.innerHTML=`<div style="max-width:640px;margin:0 auto;padding:12px 16px 100px"><h1>履歴</h1><p class="sub">確認が終わった図面が、新しい順に並びます。選ぶと、確認済みの状態で呼び出せます。</p><div class="card">${a.length?a.map((x,i)=>`<div class="row"><button data-act="hl" data-i="${i}" style="flex:1;text-align:left">${esc(x.no)} ${esc(x.name||"")}<br><span class="sub">${new Date(x.t).toLocaleDateString("ja-JP")} / ${f(x.spec.width)}×${f(x.spec.height)} / 穴${x.spec.holes.length}</span></button><button data-act="hd" data-i="${i}" aria-label="削除">✕</button></div>`).join(""):'<p class="sub">まだ履歴がありません</p>'}</div></div><nav><button class="pri" data-act="hx">閉じる</button></nav>`;o.scrollTop=0;}
const TL={quick:"速い",default:"標準",complex:"高精度"};
function tierSeg(){return`<div class="seg">${["quick","default","complex"].map(t=>`<button data-act="tier" data-t="${t}" class="${S.tier===t?"on":""}">${TL[t]}</button>`).join("")}</div>`;}
function tierCard(){return`<div class="card"><h2>読み取りの速さ</h2>${tierSeg()}<p class="sub" style="margin:4px 0 0">${{quick:"数秒が目安です。まず速く読んで、チェックリストで確認する使い方に向いています。",default:"十数秒〜かかることがあります。",complex:"いちばん慎重ですが、30秒以上かかることがあります。突き合わせの確認用におすすめです。"}[S.tier]}</p></div>`;}
function v0(){return`<div class="logo"><b>SHEET <span>MASTER</span></b><small>図面を、確かなデータに</small></div>
<div class="card">${S.url?`<img class="pv" src="${S.url}" alt="図面">`:'<p class="sub">図面の写真がありません</p>'}</div>
<div class="seg"><button data-act="cam">撮影</button><button data-act="lib">写真から選ぶ</button></div>
<input type="file" id="fc" accept="image/*" capture="environment" hidden><input type="file" id="fl" accept="image/*" hidden>
${(S.q||[]).map(t=>`<div class="warn">⚠ ${esc(t)}</div>`).join("")}
<div class="card"><h2>撮影のコツ</h2><ul style="margin:4px 0;padding-left:1.3em"><li>真上から、図面全体が入るように撮る</li><li>影や照明の反射を避ける</li><li>紙を平らにして、寸法の数字が読める大きさで</li></ul><p class="sub" style="margin:4px 0 0">撮ったあと、明るさとブレを自動で調べます。写真を選んだら、下の「図面を読み取る」を押します。</p></div>
${tierCard()}
<p style="display:flex;gap:8px;flex-wrap:wrap"><button data-act="hist">履歴から呼び出す(${hLoad().length})</button><button data-act="manual">写真なしで、手入力で進む</button></p>`;}
const KM={thickness:"t",width:"w",height:"w",chamfer:"c"};
function field(k,l,t){const kk=KM[k];return`<div class="row${kk&&S.red[kk]?" bad":""}" ${kk?`data-key="${kk}"`:""}><span>${l}</span><input ${t?'type="text"':'type="number" step="any" inputmode="decimal"'} data-k="${k}" value="${esc(S.spec[k])}"></div>`;}
function v1(){const s=S.spec;return`${Object.keys(S.red).length?`<div class="card bad" id="redbn"><b>⚠ チェックリストで未チェックだった項目が、赤く表示されています。</b><div class="sub" style="color:#fff">直したら、もう一度チェックリストを開いて、確認してください。</div></div>`:""}<div class="card"><h2>読み取り結果(必ず図面と照合してください)</h2>
${field("partName","品名",1)}${field("drawingNo","図番",1)}${field("material","材質",1)}${field("thickness","板厚 (mm)")}${field("width","幅 X (mm)")}${field("height","高さ Y (mm)")}${field("chamfer","角C (mm)")}</div>
<div class="card"><h2>プレビュー(左下が原点)</h2><div id="pv">${svg()}</div></div>
<div class="card${S.red.n?" bad":""}" data-key="n"><h2>穴(中心のX, Y と 直径Φ)</h2>${S.red.n?`<div class="sub" style="color:#fff">穴の数が違う可能性があります。穴を追加・削除してください。</div>`:""}
${s.holes.map((h,i)=>`<div class="holes${S.red["h"+i]?" bad":""}" data-key="h${i}"><input type="number" step="any" inputmode="decimal" data-i="${i}" data-k="x" value="${h.x}" aria-label="X"><input type="number" step="any" inputmode="decimal" data-i="${i}" data-k="y" value="${h.y}" aria-label="Y"><input type="number" step="any" inputmode="decimal" data-i="${i}" data-k="diameter" value="${h.diameter}" aria-label="直径"><button data-act="del" data-i="${i}" aria-label="削除">✕</button></div>`).join("")}
<button data-act="add">穴を追加</button></div>
${s.notes?`<div class="card"><h2>読み取りメモ</h2><div>${esc(s.notes)}</div></div>`:""}
<div id="wn">${warnHtml()}</div>
${S.runs.length?`<div class="card"><h2>読み取り${S.runs.length}回の結果</h2>${S.runs.map((t,i)=>`<div class="sub">${i+1}回目: ${esc(t)}</div>`).join("")}${S.blob&&S.reads.length?`<div style="margin-top:8px">${tierSeg()}</div><button data-act="reread" ${S.reads.length>=3||S.busy?"disabled":""} style="width:100%;margin-top:8px">もう一度読み取って突き合わせる(${S.reads.length}/3)</button><p class="sub">手で直した数字は、読み取り結果で上書きされます。</p>`:""}</div>`:""}
<div class="card"><h2>確認</h2>${S.skipCL?`<label class="ck" style="border:0"><input type="checkbox" id="cf" ${S.confirmed?"checked":""}><span>図面の数字と、すべて照合しました</span></label>`:`<button class="pri" data-act="cl" style="width:100%">チェックリストを開く(${clDone()}/${clItems().length})</button><p class="sub">${S.confirmed?"✔ 確認済みです":"全項目にチェックを入れると、次へ進めます"}</p>`}
<label class="ck" style="border:0"><input type="checkbox" id="sk" ${S.skipCL?"checked":""}><span class="sub">チェックリストを省略する(慣れてから)</span></label></div>`;}
function clItems(){const s=S.spec,fl=warnings(),a=[],c={};
 s.holes.forEach(o=>{const d=f(o.diameter);c[d]=(c[d]||0)+1;});
 const sm=Object.entries(c).sort((x,y)=>y[0]-x[0]).map(([d,n])=>`Φ${d}×${n}`).join(", ");
 a.push({k:"t",l:`板厚  ${f(s.thickness)} mm`},{k:"w",l:`外形  幅 ${f(s.width)} × 高さ ${f(s.height)} mm`},{k:"c",l:`角C  ${f(s.chamfer)} mm`},{k:"n",l:`穴の数  合計 ${s.holes.length} 個(${sm})`});
 s.holes.forEach((o,i)=>a.push({k:"h"+i,l:`穴${i+1}  X ${f(o.x)} / Y ${f(o.y)} / Φ${f(o.diameter)}`,w:fl.some(t=>t.includes(`穴${i+1}:`))}));
 return a;}
function clr(){S.cl={};S.red={};S.redo={};}
const clDone=()=>clItems().filter(i=>S.cl[i.k]).length;
function drawCL(){const o=$("#cl"),on=S.showCL||S.showHist;o.hidden=!on;if(!on){o.innerHTML="";return;}if(S.showHist){drawHist(o);return;}
 const it=clItems(),d=clDone();
 o.innerHTML=`<div style="max-width:640px;margin:0 auto;padding:12px 16px 100px"><h1>チェックリスト</h1><p class="sub">図面の数字を指で押さえながら、1つずつ照合してください。</p>${S.url?`<div class="card"><img class="pv" src="${S.url}" alt="図面"></div>`:""}<div class="card">${it.map(i=>`<label class="ck${S.red[i.k]?" bad":""}"><input type="checkbox" data-cl="${i.k}" ${S.cl[i.k]?"checked":""}><span>${i.w?"⚠ ":""}${esc(i.l)}${S.red[i.k]?"(要修正)":""}${S.redo[i.k]?"(修正済み・もう一度確認)":""}</span></label>`).join("")}</div></div><nav><button data-act="clx">閉じる</button><button id="clf" data-act="clfix" ${d===it.length?"disabled":""}>修正する(${it.length-d})</button><button id="cld" class="pri" data-act="cld" ${d===it.length?"":"disabled"}>${d}/${it.length} 完了</button></nav>`;o.scrollTop=0;}
function v2(){const s=S.spec,n=s.holes.filter(h=>h.diameter>0).length;return`<div class="card"><h2>作成する内容</h2>
<div class="row"><span>外形</span><span>${f(s.width)} × ${f(s.height)} mm</span></div>
${s.chamfer>0?`<div class="row"><span>角C</span><span>${f(s.chamfer)}</span></div>`:""}
<div class="row"><span>穴の数</span><span>${n} か所</span></div>
${s.thickness>0?`<div class="row"><span>板厚</span><span>${f(s.thickness)} mm</span></div>`:""}
${svg()}</div>
<div class="card"><h2>DXFデータ</h2><pre>${esc(dxf())}</pre>
<div class="seg"><button data-act="copy">コピー</button><button data-act="save" id="sv">保存(.dxf)</button><button data-act="share">共有</button></div>
<p class="sub" id="msg">外形はレイヤー CUT_OUTLINE、穴は CUT_HOLES。単位はmm、原点は左下です。「保存」を押すと、「${esc(fname())}.dxf」の名前でそのまま保存されます。</p></div>`;}
function v3(){const m=METHODS[S.method];return`<div class="seg">${METHODS.map((x,i)=>`<button data-act="meth" data-i="${i}" class="${i===S.method?"on":""}">${x.n}</button>`).join("")}</div>
<div class="card"><h2>手順</h2><ol>${m.s.map(t=>`<li>${esc(t)}</li>`).join("")}</ol>
<p class="sub">会社のパソコンは、クラウドやUSBの使用が制限されている場合があります。事前に確認してください。</p></div>
<div class="card"><h2>いつもの送り方</h2><label class="ck" style="border:0"><input type="checkbox" id="fv" ${S.fav.method===S.method?"checked":""}><span>この送り方を、いつもの方法にする</span></label>
<div class="row"><span>送り先メール</span><input type="text" id="fe" inputmode="email" value="${esc(S.fav.email||"")}" placeholder="自分のアドレス"></div>

<p><button data-act="copy">DXFをもう一度コピー</button></p><p class="sub" id="msg"></p>`;}

<p class="sub">実際のソフトの画面に合わせて、この手順は後で書き換えます。機械用のNCデータは、会社のCAMで作成します。</p>`;}

function render(){
 $("#ttl").textContent=TITLES[S.step];
 $(".bars").innerHTML=TITLES.map((_,i)=>`<i class="${i<=S.step?"on":""}"></i>`).join("");
 $("#main").innerHTML=(S.busy?`<div class="card"><div class="sub">⏳ 写真を解析しています。${{quick:"速いモードは数秒が目安です",default:"標準モードは十数秒〜かかることがあります",complex:"高精度モードは30秒以上かかることがあります"}[S.tier]}。止めたいときは、左下の「中止」を押してください。</div></div>`:"")+(S.msg?`<div class="card"><div class="warn">⚠ ${esc(S.msg)}</div></div>`:"")+[v0,v1,v2,v3,v4][S.step]();
 const bk=$("#back");bk.style.visibility=(S.step||S.busy)?"visible":"hidden";bk.textContent=S.busy?"中止":"戻る";
 const p=$("#pri");p.textContent=S.busy?"読み取り中…":["図面を読み取る","この内容でDXFを作る","次へ:パソコンへ送る","次へ:会社PCでの作業","最初に戻る"][S.step];
 p.disabled=S.busy||(S.step===0&&!S.blob)||(S.step===1&&!(ok()&&S.confirmed));
 if(S.busy)tickDraw();window.scrollTo(0,0);}
function live(){const a=$("#pv"),b=$("#wn");if(a)a.innerHTML=svg();if(b)b.innerHTML=warnHtml();const cb=document.querySelector('[data-act="cl"]');if(cb)cb.textContent=`チェックリストを開く(${clDone()}/${clItems().length})`;$("#pri").disabled=S.step===1&&!(ok()&&S.confirmed);}
function note(t){const m=$("#msg");if(m)m.textContent=t;}

function quality(c){const w=400,h=Math.max(3,Math.round(w*c.height/c.width)),t=document.createElement("canvas");t.width=w;t.height=h;const x=t.getContext("2d");x.drawImage(c,0,0,w,h);
 const d=x.getImageData(0,0,w,h).data,g=new Float32Array(w*h);let s=0;
 for(let i=0;i<g.length;i++){g[i]=.299*d[4*i]+.587*d[4*i+1]+.114*d[4*i+2];s+=g[i];}
 const m=s/g.length;let l=0,n=0;
 for(let y=1;y<h-1;y++)for(let X=1;X<w-1;X++){const i=y*w+X,e=4*g[i]-g[i-1]-g[i+1]-g[i-w]-g[i+w];l+=e*e;n++;}
 const r=[];if(Math.min(c.width,c.height)<1000)r.push("解像度が低めです。もう少し近づいて撮ってください");
 if(m<110)r.push("写真が暗めです。明るい場所で、影が入らないように撮ってください");else if(m>240)r.push("明るすぎて白く飛んでいる可能性があります。反射を避けて撮ってください");
 if(l/n<300)r.push("ピントが合っていない、またはブレている可能性があります。撮り直しを検討してください");
 return r;}
function loadImage(file){const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
 const k=Math.min(1,1600/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);
 c.getContext("2d").drawImage(im,0,0,c.width,c.height);S.url=c.toDataURL("image/jpeg",.85);S.q=quality(c);c.toBlob(b=>{S.blob=b;render();},"image/jpeg",.85);};im.src=r.result;};r.readAsDataURL(file);}

const num=v=>+v||0,agree=(a,b)=>Math.abs(a-b)<0.01;
function norm(r){return{partName:String(r.partName||""),drawingNo:String(r.drawingNo||""),material:String(r.material||""),thickness:num(r.thickness),width:num(r.width),height:num(r.height),chamfer:num(r.chamfer),notes:String(r.notes||""),xDims:(Array.isArray(r.xDims)?r.xDims:[]).map(num),yDims:(Array.isArray(r.yDims)?r.yDims:[]).map(num),holes:(Array.isArray(r.holes)?r.holes:[]).map(h=>({x:num(h.x),y:num(h.y),diameter:num(h.diameter)}))};}
function merge(rs){const m=rs[0],fl=[];
 [["thickness","板厚"],["width","幅"],["height","高さ"],["chamfer","角C"]].forEach(([k,n])=>{const v=rs.map(r=>r[k]),b=v.find(x=>v.filter(y=>agree(x,y)).length>=2);if(b!==undefined)m[k]=b;if(!v.every(x=>agree(x,v[0])))fl.push(`${n}: 読み取りが一致しません(${v.map(f).join(" / ")})`);});
 m.holes.forEach((h,i)=>{const n=rs.filter(r=>r.holes.some(o=>agree(o.x,h.x)&&agree(o.y,h.y)&&agree(o.diameter,h.diameter))).length;if(n<rs.length)fl.push(`穴${i+1}: ${rs.length}回中${n}回しか一致しませんでした。図面で確認してください`);});
 if(new Set(rs.map(r=>r.holes.length)).size>1)fl.push(`穴の数が読み取りごとに違います(${rs.map(r=>r.holes.length).join(" / ")})`);
 return fl;}
const MODEL={quick:"claude-haiku-5-5",default:"claude-sonnet-5-5",complex:"claude-opus-5-5"};
function getKey(){try{return localStorage.getItem("zm_key")||"";}catch(e){return window.__zk||"";}}
function setKey(v){window.__zk=v;try{if(v)localStorage.setItem("zm_key",v);else localStorage.removeItem("zm_key");}catch(e){}}
function errText(e){const c=e&&e.code,m={http_401:"APIキーが正しくありません。右上の「設定」で、入れ直してください",http_403:"このAPIキーでは使えません。右上の「設定」で、キーを確認してください",http_400:"リクエストが受け付けられませんでした。クレジットの残高が足りない可能性があります。Claude Consoleで残高を確認してください",http_413:"写真が大きすぎます。撮り直してください",http_429:"呼び出しが多すぎる、または利用の上限に達しました。少し待ってから、もう一度押してください",network:"通信できませんでした。電波かWi-Fiを確認して、もう一度押してください",invalid_json:"読み取り結果の形式が崩れました。もう一度押してください",upstream_error:"Claude側が混み合っています。少し待って、もう一度押してください"};
 if(!m[c]&&/^http_5/.test(c||""))return m.upstream_error;if(c==="network"&&e.detail)return m.network+"(詳細: "+e.detail+")。画面(プレビュー)が外部への通信を許可していない場合は、設定の「接続テスト」を押してください";return m[c]||"読み取りに失敗しました。もう一度押すか、手入力で進めてください";}
const API_URL="https://api.anthropic.com/v1/messages";
async function post(ctl){
 const o={method:"POST",headers:{"x-api-key":getKey(),"anthropic-version":"2023-06-01","content-type":"application/json","anthropic-dangerous-direct-browser-access":"true"},
  body:JSON.stringify({model:MODEL[S.tier],max_tokens:4000,messages:[{role:"user",content:[{type:"image",source:{type:"base64",media_type:"image/jpeg",data:S.url.split(",")[1]}},{type:"text",text:PROMPT}]}]})};
 try{return await fetch(API_URL,Object.assign({},o,{signal:ctl.signal}));}
 catch(e){
  if(e&&e.name==="AbortError")throw{code:"cancelled"};
  if(e&&(e.name==="DataCloneError"||/clone/i.test(String(e.message||e)))){
   try{return await fetch(API_URL,o);}catch(e2){throw{code:"network",detail:String((e2&&e2.message)||e2)};}}
  throw{code:"network",detail:String((e&&e.message)||e)};}}
async function callApi(ctl,cancelP){
 const res=await Promise.race([post(ctl),cancelP]);
 if(res==="cancel")throw{code:"cancelled"};
 if(!res.ok)throw{code:"http_"+res.status};
 const raw=await Promise.race([res.text(),cancelP]);
 if(raw==="cancel")throw{code:"cancelled"};
 let j;try{j=JSON.parse(raw);}catch(e){throw{code:"invalid_json"};}
 return(j.content||[]).filter(x=>x.type==="text").map(x=>x.text).join("");}
function parseJson(t){const a=t.indexOf("{"),b=t.lastIndexOf("}");if(a<0||b<a)throw{code:"invalid_json"};try{return JSON.parse(t.slice(a,b+1));}catch(e){throw{code:"invalid_json"};}}
async function readOnce(){
 if(!getKey()){S.msg="先に、右上の「設定」で、APIキーを入れてください";S.showSet=true;drawSet();return false;}
 let stop;const cancelP=new Promise(r=>{stop=()=>r("cancel");}),ctl=new AbortController();
 S.abort={abort(){try{ctl.abort();}catch(e){}stop();}};
 S.busy=true;S.msg="";S.found=0;S.t0=Date.now();render();clearInterval(S.tick);S.tick=setInterval(tickDraw,500);
 try{const t=await callApi(ctl,cancelP);
  S.reads.push(norm(parseJson(t)));S.meta.push({tier:S.tier,sec:(Date.now()-S.t0)/1000});return true;}
 catch(e){if(!(e&&e.code==="cancelled"))S.msg=errText(e);return false;}
 finally{clearInterval(S.tick);S.busy=false;S.abort=null;}}
function tickDraw(){const p=$("#pri");if(!S.busy||!p)return;p.textContent="読み取り中 "+Math.round((Date.now()-S.t0)/1000)+"秒"+(S.found?`(穴 ${S.found}個を検出)`:"");}
function applyReads(){const rs=S.reads.map(r=>JSON.parse(JSON.stringify(r)));
 S.runs=S.reads.map((r,i)=>`${TL[S.meta[i].tier]}・${S.meta[i].sec.toFixed(1)}秒 / ${f(r.width)}×${f(r.height)} / 板厚${f(r.thickness)} / 穴${r.holes.length}`);
 S.flags=rs.length>1?merge(rs):[];S.spec=rs[0];S.confirmed=false;clr();}
async function readDrawing(){S.reads=[];S.meta=[];const ok=await readOnce();if(ok){applyReads();S.step=1;}render();}
async function rereadDrawing(){if(S.busy||S.reads.length>=3||!S.blob)return;const ok=await readOnce();if(ok)applyReads();render();}
function resetAll(){S.step=0;S.url="";S.blob=null;S.spec=blank();S.checked={};S.flags=[];S.runs=[];S.reads=[];S.meta=[];S.q=[];S.confirmed=false;clr();S.msg="";S.busy=false;S.showCL=false;S.showHist=false;S.showSet=false;drawSet();drawCL();render();}

async function copyDxf(){const t=dxf();try{await navigator.clipboard.writeText(t);note("コピーしました。メモなどに貼り付けてください。");}
 catch(e){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();let k=false;try{k=document.execCommand("copy");}catch(_){}a.remove();note(k?"コピーしました。":"コピーできませんでした。「保存」を使ってください。");}}
async function saveDxf(){const name=fname()+".dxf";
 try{const u=URL.createObjectURL(new Blob([dxf()],{type:"application/dxf"})),a=document.createElement("a");a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),5000);note("「"+name+"」を保存しました。保存先は、ダウンロードの場所を確認してください。");}
 catch(e){note("保存できませんでした。「共有」か「コピー」を使ってください。");}}
async function shareDxf(){const f=new File([dxf()],fname()+".dxf",{type:"application/dxf"});
 try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:f.name});note("共有しました。");}else note("この環境では、ファイルの共有ができません。「保存」か「コピー」を使ってください。");}
 catch(e){if(!(e&&e.name==="AbortError"))note("共有できませんでした。「保存」か「コピー」を使ってください。");}}

 if(t.dataset.i!==undefined)S.spec.holes[+t.dataset.i][k]=+t.value||0;
 else S.spec[k]=t.type==="number"?(+t.value||0):t.value;S.confirmed=false;const kk=t.dataset.i!==undefined?"h"+t.dataset.i:({thickness:"t",width:"w",height:"w",chamfer:"c"})[k];
 if(kk){if(S.cl[kk]||S.red[kk])S.redo[kk]=1;delete S.cl[kk];delete S.red[kk];document.querySelectorAll(`[data-key="${kk}"]`).forEach(e=>e.classList.remove("bad"));}
 const bn=$("#redbn");if(bn&&!Object.keys(S.red).length)bn.remove();
 const c=$("#cf");if(c)c.checked=false;live();});
$("#main").addEventListener("change",e=>{const t=e.target;
 if(t.id==="fc"||t.id==="fl"){if(t.files[0])loadImage(t.files[0]);}
 if(t.dataset.c!==undefined)S.checked[t.dataset.c]=t.checked;

 if(t.id==="sk"){S.skipCL=t.checked;S.confirmed=false;render();}

 if(t.id==="fe"){S.fav.email=t.value.trim();fSave();render();}});
$("#main").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const a=b.dataset.act,i=+b.dataset.i;
 if(a==="cam")$("#fc").click();else if(a==="lib")$("#fl").click();
 else if(a==="manual"){S.step=1;render();}
 else if(a==="add"){S.spec.holes.push({x:0,y:0,diameter:0});S.confirmed=false;clr();render();}
 else if(a==="del"){S.spec.holes.splice(i,1);S.confirmed=false;clr();render();}
 else if(a==="meth"){S.method=i;render();}

 else if(a==="hist"){S.showHist=true;drawCL();}
 else if(a==="reread"){rereadDrawing();}
 else if(a==="tier"){S.tier=b.dataset.t;render();}
 else if(a==="copy")copyDxf();else if(a==="save")saveDxf();else if(a==="share")shareDxf();});
$("#back").onclick=()=>{S.msg="";if(S.busy&&S.abort){S.abort.abort();return;}if(S.step>0){S.step--;render();}};
$("#pri").onclick=()=>{S.msg="";
 if(S.step===0)readDrawing();
 else if(S.step<4){if(S.step===1)hSave();S.step++;render();}

let arm=0;$("#rst").onclick=()=>{const b=$("#rst");if(!arm&&(S.step>0||S.blob)){arm=1;b.textContent="もう一度押すと消去";setTimeout(()=>{arm=0;b.textContent="最初から";},4000);return;}arm=0;b.textContent="最初から";if(S.abort)S.abort.abort();resetAll();};
$("#cl").addEventListener("change",e=>{const k=e.target.dataset.cl;if(k===undefined)return;S.cl[k]=e.target.checked;const n=clItems().length,d=clDone(),b=$("#cld");b.textContent=d+"/"+n+" 完了";b.disabled=d!==n;const g2=$("#clf");g2.textContent=`修正する(${n-d})`;g2.disabled=d===n;});
$("#cl").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const a=b.dataset.act,i=+b.dataset.i;
 if(a==="clx"){S.showCL=false;drawCL();}
 else if(a==="cld"){S.confirmed=true;S.red={};S.redo={};S.showCL=false;drawCL();render();}
 else if(a==="clfix"){S.red={};clItems().forEach(x=>{if(!S.cl[x.k])S.red[x.k]=1;});S.showCL=false;drawCL();render();const e=document.querySelector("#main .bad");if(e)e.scrollIntoView({block:"center"});}
 else if(a==="hx"){S.showHist=false;drawCL();}

function drawSet(){const o=$("#st");o.hidden=!S.showSet;if(!S.showSet){o.innerHTML="";return;}const k=getKey();
 o.innerHTML=`<div style="max-width:640px;margin:0 auto;padding:12px 16px 100px"><h1>設定</h1>

<p class="sub">状態: ${k?"設定済み(末尾 "+esc(k.slice(-4))+")":"未設定"}</p>

${k?'<div class="seg"><button data-act="keydel">キーを消す</button></div>':""}</div>
<nav><button data-act="setx">閉じる</button><button class="pri" data-act="keysave">保存</button></nav>`;o.scrollTop=0;}
$("#gear").onclick=()=>{S.showSet=true;drawSet();};
$("#st").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const a=b.dataset.act;
 if(a==="setx"){S.showSet=false;drawSet();}
 else if(a==="keysave"){const v=($("#kv").value||"").trim();if(v)setKey(v);S.showSet=false;if(v)S.msg="";drawSet();render();}

async function testKey(){const o=$("#kt"),k=(($("#kv")||{}).value||"").trim()||getKey();if(!k){o.textContent="先に、キーを入力してください";return;}o.textContent="接続を確認しています…";
 try{const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"x-api-key":k,"anthropic-version":"2023-06-01","content-type":"application/json","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-haiku-5-5",max_tokens:16,messages:[{role:"user",content:"OKとだけ返してください"}]})});
  if(r.ok)o.textContent="✔ 接続できました。このキーは使えます。";else{let m="";try{const j=await r.json();m=(j.error&&j.error.message)||"";}catch(_){}o.textContent="× 接続はできましたが、拒否されました(HTTP "+r.status+")。"+m;}}
 catch(e){o.textContent="× 通信できませんでした(詳細: "+(e&&e.message||e)+")。この画面が外部への通信を許可していない可能性があります。パソコンのChromeなど、ふつうのブラウザで開いてみてください。";}}
