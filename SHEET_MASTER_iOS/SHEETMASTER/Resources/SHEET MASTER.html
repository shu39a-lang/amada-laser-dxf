<!--
引き継ぎメモ(SHEET MASTER・1ファイル版 v3: 平面切断用。自由形状(円弧・多角形・星形)/長穴/角穴/けがき/手書きの書き込みに対応)
- このファイル1つで動きます。外部のライブラリはありません。
- APIキーは、コードに入れないでください。利用者が、画面右上の「設定」で入力します(端末内に保存)。
- 通信先は https://api.anthropic.com/v1/messages だけです。図面の写真が送信されます。
- 設定画面の「APIキーをお持ちでない方へ」にある購入・作成ページへのリンクは、スクリプト内の KEY_LINKS.on を false にすると、リンクなしの文章だけになります(審査で指摘された場合に使います)。
-->

<script>
const TITLES=["① 図面を撮影","② 読み取り結果の確認","③ DXFを作成","④ パソコンへ送る","⑤ 会社PCでの作業"];
const METHODS=[
 {n:"クラウド",s:["前の画面の「保存」を押して、DXFファイルとメモを保存する","保存したファイルを、OneDrive や Googleドライブなどに入れる","会社のパソコンで同じクラウドを開き、ダウンロードする","作業用フォルダ(デスクトップなど)に置く"]},
 {n:"メール",s:["前の画面の「共有」か「保存」で、DXFファイルを作る","そのファイルを、自分宛てのメールに添付して送る(添付できないときは、下の「メールで送る」で本文に入れる)","会社のパソコンで、添付ファイルを保存する","本文に入れて送った場合は、メモ帳に貼り付けて「図番.dxf」(種類:すべてのファイル)で保存する"]},
 {n:"USBケーブル",s:["iPhoneをパソコンにつなぎ、「信頼」を選ぶ","前の画面の「保存」で、iPhoneのファイルに保存する","パソコンの「Appleデバイス」アプリなどから、ファイルを取り出す","作業用フォルダに置く"]}];
const CHECK=["DXFとメモをパソコンの作業フォルダに保存した(DXFの拡張子は .dxf)","加工用ソフト(CAM)を起動し、DXFを読み込んだ","単位がmm、原点が左下になっているか確認した","外形・穴・切り抜きの形と寸法を、図面と照合した","材質と板厚を設定し、加工条件を選んだ","機械用のプログラムを作成した","USBに保存し、機械に入力する前に現場の担当者に確認してもらった"];
const PROMPT=`You are reading a Japanese drawing of a FLAT sheet-metal plate that will be cut on a laser cutting machine. Only the flat cut shape matters. If the drawing is a bent part, read the flat pattern (展開図) if one is printed; otherwise put "曲げ部品で展開図なし" in unsupported.
Return ONLY one JSON object (no markdown, no comments).
Keys:
partName, drawingNo, material (strings); thickness (number, mm).
width, height (numbers, mm): overall size (bounding box) of the plate in X and Y.
chamfer (number): corner chamfer C value if the outline is a plain rectangle with equal corner chamfers, else 0.
shape: array of outline points {"s","x","y","r","dir"} for ANY shape that is not just a rectangle/round hole/slot, such as a star, polygon, notched or stepped outline, rounded corners, arcs.
  s = shape number. 0 = the OUTER outline (use only if the outer outline is not a plain rectangle with equal chamfers). 1, 2, 3... = each inner cut-out that is not a round hole, slot or axis-aligned rectangle. List the vertices of one shape consecutively, in order around the shape.
  x, y = vertex position in mm from the origin.
  r, dir = describe the edge going FROM this vertex TO the next vertex (the last vertex connects back to the first). Straight edge: r=0, dir="". Arc edge: r = arc radius in mm; dir = direction of travel along the arc as seen on the drawing: "ccw" (counter-clockwise) or "cw" (clockwise); append "_big" (e.g. "ccw_big") only if the arc is longer than 180 degrees.
  A rounded corner = two vertices at the tangent points, the first with the arc r/dir. A semicircular end = two vertices at the ends of the diameter, r = half the diameter. A round plate = two vertices (0, D/2) and (D, D/2), both with r=D/2 and dir="ccw".
holes: [{"x","y","diameter"}] round holes, center positions. Compute hole positions from pitch circles (PCD), equal pitches or symmetric layouts and write the computed centers.
slots: [{"x","y","length","width","angle"}] long holes (長穴): center, overall length, width, angle of the long axis from the X axis (0 or 90).
rects: [{"x","y","w","h"}] rectangular holes (角穴) with sides parallel to X/Y: center, size along X (w) and along Y (h). Tilted rectangles go into shape.
scribes: [{"x1","y1","x2","y2"}] scribe / marking lines (けがき, 罫書き) that the laser should mark, not cut.
texts: [{"text","x","y","h","angle"}] text to be marked by the laser (part numbers, symbols): text, lower-left position, character height in mm, rotation in degrees.
hand: array of short Japanese strings: every HANDWRITTEN mark on the drawing (pen or pencil additions, corrections, crossed-out values, added shapes, arrows, memos). When a printed dimension is crossed out and replaced by hand, use the hand-written (newer) value in the data above AND list it here as "手書き修正: 旧→新(場所)". When a handwritten addition is a cut shape or scribe, include it in the data above AND list it here.
extras: array of short Japanese strings for other printed items that matter: quantity, tolerances, surface treatment, burr direction, notes (注記).
unsupported: array of strings: shapes or features you could NOT express in the fields above (ellipses, splines, countersinks, engraving artwork, unclear or hidden dimensions), with where they are.
notes (string): anything you were unsure about.
xDims, yDims: arrays of numbers: every horizontal / vertical position dimension printed on the drawing, measured from the origin, including the overall size.
Rules:
- Origin = bottom-left corner of the plate (its bounding box). All x, y are in mm from that origin.
- Expand notations such as "2-φ6.5" into individual entries and locate each one from the dimension lines.
- M3x0.5 tapped hole: holes diameter 2.5 (note the tap in extras). Other taps: standard tap-drill diameter, or 0 if unsure.
- Do not invent values. If a value cannot be read, use 0 or "" and say so in notes. Never guess silently.`;

/* ---- 切断データの種類(表形式で定義) ---- */
const DIRS=[["","直"],["ccw","左"],["cw","右"],["ccw_big","左大"],["cw_big","右大"]];
const G={
 shape:{p:"o",n:"形状点",l:"自由形状(外形・切り抜き)",cols:[["s","形状番号"],["x","X"],["y","Y"],["r","円弧R"],["dir","円弧","d"]],b:()=>({s:0,x:0,y:0,r:0,dir:""}),note:"形状番号 0 が外形、1以上が切り抜きです。点は順番に並べ、「円弧」は、その点から次の点までの辺の種類です(直=直線 / 左=反時計回りの円弧 / 右=時計回りの円弧 / 大=180°超の円弧)。"},
 holes:{p:"h",n:"穴",l:"丸穴(中心のX, Y と 直径Φ)",cols:[["x","X"],["y","Y"],["diameter","Φ"]],b:()=>({x:0,y:0,diameter:0})},
 slots:{p:"s",n:"長穴",l:"長穴",cols:[["x","中心X"],["y","中心Y"],["length","全長"],["width","幅"],["angle","向き°"]],b:()=>({x:0,y:0,length:0,width:0,angle:0}),note:"向きは、長い方向。横長なら0、縦長なら90です。"},
 rects:{p:"r",n:"角穴",l:"角穴",cols:[["x","中心X"],["y","中心Y"],["w","X方向"],["h","Y方向"]],b:()=>({x:0,y:0,w:0,h:0})},
 scribes:{p:"k",n:"けがき線",l:"けがき線(切らずに、線を引く)",cols:[["x1","X1"],["y1","Y1"],["x2","X2"],["y2","Y2"]],b:()=>({x1:0,y1:0,x2:0,y2:0})},
 texts:{p:"m",n:"けがき文字",l:"けがき文字",cols:[["text","文字","t"],["x","X"],["y","Y"],["h","高さ"],["angle","角度°"]],b:()=>({text:"",x:0,y:0,h:0,angle:0}),note:"文字の左下の位置です。日本語は、DXFで文字化けすることがあります。"},
 hand:{p:"y",n:"手書き",l:"図面の手書きの書き込み",list:true,note:"手書きの修正や追加です。データに反映したものも、反映していないものも、ここに出ます。1つずつ、図面と照合してください。"},
 extras:{p:"x",n:"注記",l:"注記・その他の記載",list:true},
 unsupported:{p:"z",n:"未対応",l:"このアプリで扱えない記載",list:true,note:"図面にあるのに、このアプリでは図形にできないものです。会社のCAMや手作業で、対応が必要です。"}};
const GK=Object.keys(G),NUMG=GK.filter(k=>!G[k].list),LISTS=GK.filter(k=>G[k].list);
const blank=()=>{const o={partName:"",drawingNo:"",material:"",thickness:0,width:0,height:0,chamfer:0,notes:"",xDims:[],yDims:[]};GK.forEach(k=>o[k]=[]);return o;};
function fill(s){const o=Object.assign(blank(),s||{});GK.forEach(k=>{if(!Array.isArray(o[k]))o[k]=[];});return o;}
const S={step:0,url:"",blob:null,busy:false,spec:blank(),method:0,checked:{},flags:[],confirmed:false,runs:[],cl:{},red:{},redo:{},open:{},showCL:false,skipCL:false,showHist:false,showSet:false,fav:{},q:[],reads:[],meta:[],msg:"",abort:null,tier:"default",t0:0,tick:null};
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const f=v=>String(+(+v).toFixed(4));
const ok=()=>S.spec.width>0&&S.spec.height>0;

/* ---- 形状の計算 ---- */
function shapes(s){const m=new Map();s.shape.forEach(p=>{const k=Math.round(p.s);if(!m.has(k))m.set(k,[]);m.get(k).push(p);});return[...m.entries()].sort((a,b)=>a[0]-b[0]).map(([k,pts])=>({s:k,pts}));}
function outerPts(s){const o=shapes(s).find(x=>x.s===0);return o&&o.pts.length>=2?o.pts:null;}
function arcOf(p,q){if(!(p.r>0)||!p.dir)return null;
 const dx=q.x-p.x,dy=q.y-p.y,c=Math.hypot(dx,dy);if(c<1e-9)return null;
 const r=Math.max(p.r,c/2),h=Math.sqrt(Math.max(0,r*r-c*c/4)),ccw=p.dir.startsWith("ccw"),big=p.dir.endsWith("big"),sg=(ccw?1:-1)*(big?-1:1);
 const cx=(p.x+q.x)/2+sg*(-dy/c)*h,cy=(p.y+q.y)/2+sg*(dx/c)*h;
 return{cx,cy,r,ccw,big,a1:Math.atan2(p.y-cy,p.x-cx),a2:Math.atan2(q.y-cy,q.x-cx),small:p.r<c/2-0.01};}
function samplePts(pts){const out=[];pts.forEach((p,i)=>{const q=pts[(i+1)%pts.length];out.push([p.x,p.y]);const a=arcOf(p,q);
 if(a){let d=a.a2-a.a1;if(a.ccw){while(d<=1e-9)d+=2*Math.PI;}else{while(d>=-1e-9)d-=2*Math.PI;}for(let k=1;k<24;k++){const t=a.a1+d*k/24;out.push([a.cx+a.r*Math.cos(t),a.cy+a.r*Math.sin(t)]);}}});return out;}
function rectPoly(s){const{width:w,height:h,chamfer:c}=s;return c>0?[[c,0],[w-c,0],[w,c],[w,h-c],[w-c,h],[c,h],[0,h-c],[0,c]]:[[0,0],[w,0],[w,h],[0,h]];}
function outerPoly(s){const o=outerPts(s);return o?samplePts(o):rectPoly(s);}
function inPoly(x,y,P){let c=false;for(let i=0,j=P.length-1;i<P.length;j=i++){const a=P[i],b=P[j];if((a[1]>y)!==(b[1]>y)&&x<(b[0]-a[0])*(y-a[1])/(b[1]-a[1])+a[0])c=!c;}return c;}
function segDist(px,py,x1,y1,x2,y2){const dx=x2-x1,dy=y2-y1,l=dx*dx+dy*dy;let t=l?((px-x1)*dx+(py-y1)*dy)/l:0;t=Math.max(0,Math.min(1,t));return Math.hypot(px-x1-t*dx,py-y1-t*dy);}
function polyDist(x,y,P){let m=1e9;for(let i=0;i<P.length;i++){const a=P[i],b=P[(i+1)%P.length];m=Math.min(m,segDist(x,y,a[0],a[1],b[0],b[1]));}return m;}
function bbox(gk,o){
 if(gk==="holes"){const r=o.diameter/2;return[o.x-r,o.y-r,o.x+r,o.y+r];}
 if(gk==="slots"){const a=o.angle*Math.PI/180,c=Math.abs(Math.cos(a)),n=Math.abs(Math.sin(a)),hx=(o.length*c+o.width*n)/2,hy=(o.length*n+o.width*c)/2;return[o.x-hx,o.y-hy,o.x+hx,o.y+hy];}
 return[o.x-o.w/2,o.y-o.h/2,o.x+o.w/2,o.y+o.h/2];}
function warnings(){const s=S.spec,w=[...S.flags],t=s.thickness;
 if(!ok())w.push("外形寸法が未入力です");
 if(s.chamfer>0&&!outerPts(s)&&s.chamfer*2>=Math.min(s.width,s.height))w.push("角Cが外形に対して大きすぎます");
 const P=outerPoly(s),xs=P.map(p=>p[0]),ys=P.map(p=>p[1]);
 if(outerPts(s)&&ok()){const bw=Math.max(...xs)-Math.min(...xs),bh=Math.max(...ys)-Math.min(...ys);
  if(Math.abs(bw-s.width)>0.05||Math.abs(bh-s.height)>0.05)w.push(`外形の形状から求めた大きさ ${f(bw)}×${f(bh)} が、幅×高さ(${f(s.width)}×${f(s.height)})と合いません`);
  if(Math.min(...xs)<-0.05||Math.min(...ys)<-0.05)w.push("外形の形状が、原点(左下)より、左または下にはみ出しています");}
 shapes(s).forEach(sh=>{const nm=sh.s===0?"外形":`切り抜き${sh.s}`;
  const arcs=sh.pts.filter(p=>p.r>0&&p.dir).length;
  if(sh.pts.length<3&&!(sh.pts.length===2&&arcs===2))w.push(`${nm}: 点が足りません(3点以上、または円弧2つの2点が必要です)`);
  if(sh.s!==0&&sh.pts.length>=3&&ok()){const q=sh.pts[0];if(!inPoly(q.x,q.y,P)&&P.length>2)w.push(`${nm}: 外形の外側にある可能性があります`);}});
 s.shape.forEach((p,i)=>{const n=`形状点${i+1}`,sh=shapes(s).find(x=>x.s===Math.round(p.s));if(!sh)return;const k=sh.pts.indexOf(p),q=sh.pts[(k+1)%sh.pts.length];
  if(p.r>0&&!p.dir)w.push(`${n}: 円弧のRがあるのに、向きが未指定です(直線として扱います)`);
  if(!(p.r>0)&&p.dir)w.push(`${n}: 円弧の向きがあるのに、Rが未入力です(直線として扱います)`);
  if(Math.hypot(q.x-p.x,q.y-p.y)<0.01&&sh.pts.length>1)w.push(`${n}: 次の点と同じ位置です`);
  const a=arcOf(p,q);if(a&&a.small)w.push(`${n}: 円弧のR${f(p.r)}が、2点の距離の半分より小さいため、半円に補正します`);
  if(Math.round(p.s)!==p.s||p.s<0)w.push(`${n}: 形状番号が正しくありません`);});
 s.holes.forEach((o,i)=>{const n=`穴${i+1}`;if(!(o.diameter>0)){w.push(`${n}: 直径が未入力です`);return;}
  if(t>0&&o.diameter<t)w.push(`${n}: Φ${f(o.diameter)}は板厚${f(t)}mmより小さく、レーザーでは仕上がりが悪くなる可能性があります。ドリル加工も検討してください`);
  if(t>0&&ok()&&inPoly(o.x,o.y,P)&&polyDist(o.x,o.y,P)-o.diameter/2<t-0.01)w.push(`${n}: 外形の縁に近すぎる可能性があります(縁まで ${f(Math.max(polyDist(o.x,o.y,P)-o.diameter/2,0))}mm。目安は板厚${f(t)}mm以上)`);});
 s.slots.forEach((o,i)=>{const n=`長穴${i+1}`;if(!(o.length>0&&o.width>0))w.push(`${n}: 全長または幅が未入力です`);else if(o.length<o.width)w.push(`${n}: 全長が幅より短くなっています`);
  if(o.angle!==0&&o.angle!==90)w.push(`${n}: 向きが0でも90でもありません(斜めの長穴は、DXFに出しますが、要確認です)`);});

function quality(c){const w=400,h=Math.max(3,Math.round(w*c.height/c.width)),t=document.createElement("canvas");t.width=w;t.height=h;const x=t.getContext("2d");x.drawImage(c,0,0,w,h);
 const d=x.getImageData(0,0,w,h).data,g=new Float32Array(w*h);let s=0;
 for(let i=0;i<g.length;i++){g[i]=.299*d[4*i]+.587*d[4*i+1]+.114*d[4*i+2];s+=g[i];}
 const m=s/g.length;let l=0,n=0;
 for(let y=1;y<h-1;y++)for(let X=1;X<w-1;X++){const i=y*w+X,e=4*g[i]-g[i-1]-g[i+1]-g[i-w]-g[i+w];l+=e*e;n++;}
 const r=[];if(Math.min(c.width,c.height)<1000)r.push("解像度が低めです。もう少し近づいて撮ってください");
 if(m<110)r.push("写真が暗めです。明るい場所で、影が入らないように撮ってください");else if(m>240)r.push("明るすぎて白く飛んでいる可能性があります。反射を避けて撮ってください");
 if(l/n<300)r.push("ピントが合っていない、またはブレている可能性があります。撮り直しを検討してください");
 return r;}

 [["thickness","板厚"],["width","幅"],["height","高さ"],["chamfer","角C"]].forEach(([k,n])=>{const v=rs.map(r=>r[k]),b=v.find(x=>v.filter(y=>agree(x,y)).length>=2);if(b!==undefined)m[k]=b;if(!v.every(x=>agree(x,v[0])))fl.push(`${n}: 読み取りが一致しません(${v.map(f).join(" / ")})`);});
 NUMG.forEach(gk=>{const g=G[gk],mt=(a,b)=>g.cols.every(([k,,ty])=>ty==="d"||ty==="t"?a[k]===b[k]:agree(a[k],b[k]));
  m[gk].forEach((h,i)=>{const n=rs.filter(r=>r[gk].some(o=>mt(o,h))).length;if(n<rs.length)fl.push(`${g.n}${i+1}: ${rs.length}回中${n}回しか一致しませんでした。図面で確認してください`);});

 return fl;}

const API_URL="https://api.anthropic.com/v1/messages";
async function post(ctl){
 const o={method:"POST",headers:{"x-api-key":getKey(),"anthropic-version":"2023-06-01","content-type":"application/json","anthropic-dangerous-direct-browser-access":"true"},
  body:JSON.stringify({model:MODEL[S.tier],max_tokens:8000,messages:[{role:"user",content:[{type:"image",source:{type:"base64",media_type:"image/jpeg",data:S.url.split(",")[1]}},{type:"text",text:PROMPT}]}]})};
 try{return await fetch(API_URL,Object.assign({},o,{signal:ctl.signal}));}
 catch(e){
  if(e&&e.name==="AbortError")throw{code:"cancelled"};
  if(e&&(e.name==="DataCloneError"||/clone/i.test(String(e.message||e)))){
   try{return await fetch(API_URL,o);}catch(e2){throw{code:"network",detail:String((e2&&e2.message)||e2)};}}
  throw{code:"network",detail:String((e&&e.message)||e)};}}
async function callApi(ctl,cancelP){
 const res=await Promise.race([post(ctl),cancelP]);
 if(res==="cancel")throw{code:"cancelled"};
 if(!res.ok)throw{code:"http_"+res.status};
 const raw=await Promise.race([res.text(),cancelP]);
 if(raw==="cancel")throw{code:"cancelled"};
 let j;try{j=JSON.parse(raw);}catch(e){throw{code:"invalid_json"};}
 return(j.content||[]).filter(x=>x.type==="text").map(x=>x.text).join("");}
function parseJson(t){const a=t.indexOf("{"),b=t.lastIndexOf("}");if(a<0||b<a)throw{code:"invalid_json"};try{return JSON.parse(t.slice(a,b+1));}catch(e){throw{code:"invalid_json"};}}

 S.abort={abort(){try{ctl.abort();}catch(e){}stop();}};
 S.busy=true;S.msg="";S.t0=Date.now();render();clearInterval(S.tick);S.tick=setInterval(tickDraw,500);
 try{const t=await callApi(ctl,cancelP);
  S.reads.push(norm(parseJson(t)));S.meta.push({tier:S.tier,sec:(Date.now()-S.t0)/1000});return true;}
 catch(e){if(!(e&&e.code==="cancelled"))S.msg=errText(e);return false;}

 else if(a==="hl"){const x=hLoad()[i];if(x){S.spec=fill(JSON.parse(JSON.stringify(x.spec)));S.flags=[];S.runs=[];S.open={};clr();S.confirmed=true;S.showHist=false;S.step=1;drawCL();render();}}});
const KEY_LINKS={on:true,keys:"https://platform.claude.com/settings/keys",billing:"https://platform.claude.com/settings/billing",guide:"https://platform.claude.com/docs/get-api-key"};
function lk(u,t){return KEY_LINKS.on?`<a href="${u}" target="_blank" rel="noopener noreferrer" style="color:var(--ac);font-weight:600">${t} ↗</a>`:`<span style="color:var(--ac)">${t}</span>`;}
function keyHelp(){return`<div class="card"><h2>APIキーをお持ちでない方へ</h2>
<p style="margin:4px 0">このアプリは、ご自身のClaude APIキーで動きます。持っていない場合は、Claude Console(platform.claude.com)で、次の順に用意してください。</p>
<ol style="margin:6px 0">
<li>${lk(KEY_LINKS.billing,"請求ページ")}で、クレジットを購入する(前払い)</li>
<li>${lk(KEY_LINKS.keys,"APIキーのページ")}で、キーを作成する</li>
<li>作ったキーを、上の欄に貼り付けて、「保存」を押す</li></ol>
<p class="sub">・キーは、作成した直後に、一度だけ表示されます。その場で、必ずコピーしてください。<br>・料金は、使った分だけ、クレジットから引かれます。クレジットは、購入から1年で期限が切れ、返金はされません。<br>・Claudeのチャットの月額プランとは、別の契約です。<br>・残高がなくなると、読み取りが止まります。請求ページで、残高の確認と、自動チャージの設定ができます。<br>・キーが使えなくなったとき(削除、期限切れなど)は、新しいキーを作って、ここで入れ直してください。</p>
<p class="sub">${lk(KEY_LINKS.guide,"公式の手順を見る")}</p></div>`;}
function drawSet(){const o=$("#st");o.hidden=!S.showSet;if(!S.showSet){o.innerHTML="";return;}const k=getKey();
 o.innerHTML=`<div style="max-width:640px;margin:0 auto;padding:12px 16px 100px"><h1>設定</h1>
<div class="card"><h2>読み取り用のAPIキー</h2><input type="password" id="kv" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="sk-ant-..." style="width:100%">
<p class="sub">状態: ${k?"設定済み(末尾 "+esc(k.slice(-4))+")":"未設定"}</p>
<p class="sub">キーは、この端末の、この画面の中にだけ保存されます。他の人に見せたり、メールやチャットで送ったりしないでください。</p></div>
${keyHelp()}
<div class="card"><h2>ご注意</h2><p class="sub">図面を読み取ると、写真がAnthropic(Claude)のサービスに送信されます。取引先の図面を使う場合は、会社の許可を得てから使ってください。</p></div>
<div class="card"><h2>接続テスト</h2><div class="seg"><button data-act="keytest">接続テスト</button></div><p class="sub" id="kt">キーを入れて、押してください。写真は送りません。</p></div>
${k?'<div class="seg"><button data-act="keydel">キーを消す</button></div>':""}</div>
<nav><button data-act="setx">閉じる</button><button class="pri" data-act="keysave">保存</button></nav>`;o.scrollTop=0;}
$("#gear").onclick=()=>{S.showSet=true;drawSet();};
$("#st").addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;const a=b.dataset.act;
 if(a==="setx"){S.showSet=false;drawSet();}
 else if(a==="keysave"){const v=($("#kv").value||"").trim();if(v)setKey(v);S.showSet=false;if(v)S.msg="";drawSet();render();}
 else if(a==="keydel"){setKey("");drawSet();}
 else if(a==="keytest")testKey();});
async function testKey(){const o=$("#kt"),k=(($("#kv")||{}).value||"").trim()||getKey();if(!k){o.textContent="先に、キーを入力してください";return;}o.textContent="接続を確認しています…";
 try{const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"x-api-key":k,"anthropic-version":"2023-06-01","content-type":"application/json","anthropic-dangerous-direct-browser-access":"true"},body:JSON.stringify({model:"claude-haiku-5-5",max_tokens:16,messages:[{role:"user",content:"OKとだけ返してください"}]})});
  if(r.ok)o.textContent="✔ 接続できました。このキーは使えます。";else{let m="";try{const j=await r.json();m=(j.error&&j.error.message)||"";}catch(_){}o.textContent="× 接続はできましたが、拒否されました(HTTP "+r.status+")。"+m;}}
 catch(e){o.textContent="× 通信できませんでした(詳細: "+(e&&e.message||e)+")。この画面が外部への通信を許可していない可能性があります。パソコンのChromeなど、ふつうのブラウザで開いてみてください。";}}
S.fav=fLoad();S.method=S.fav.method||0;
render();
</script>
