workflows:
  sheet-master-v2:
    name: SHEET MASTER v2.4 - TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: codemagic7
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.shu39a.amadaoffline
      xcode: latest
    scripts:
      - name: Verify and extract original 2.4 project
        script: bash prepare.sh
      - name: Archive and export signed IPA
        script: bash archive.sh
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
