workflows:
  ios-testflight:
    name: SHEET MASTER - iOS TestFlight
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
      cancel_previous_builds: true
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic7
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.shu39a.amadaoffline
      vars:
        XCODE_PROJECT: "AMADAOffline.xcodeproj"
        XCODE_SCHEME: "AMADAOffline"
      xcode: latest
    scripts:
      - name: Configure Google AI HTTPS endpoint
        script: |
          set -euo pipefail
          : "${SHEET_MASTER_API_URL:?Google AI Cloud Run endpoint is not deployed or configured}"
          case "$SHEET_MASTER_API_URL" in
            https://*) ;;
            *) echo "Endpoint must use HTTPS"; exit 1 ;;
          esac
          /usr/libexec/PlistBuddy -c "Set :SHEET_MASTER_API_URL $SHEET_MASTER_API_URL" "$CM_BUILD_DIR/AMADAOffline/Info.plist"
      - name: Apply Apple signing profiles
        script: xcode-project use-profiles
      - name: Set unique build version
        script: |
          cd "$CM_BUILD_DIR"
          xcrun agvtool new-version -all "$BUILD_NUMBER"
      - name: Build IPA
        script: |
          xcode-project build-ipa --project "$CM_BUILD_DIR/$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/**/*.dSYM
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
