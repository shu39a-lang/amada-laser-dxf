workflows:
  sheet-master-v2:
    name: SHEET MASTER v2 - TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 60
    integrations:
      app_store_connect: codemagic7
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.shu39a.amadaoffline
      xcode: latest
    scripts:
      - name: Verify original archive and generate project
        script: bash prepare.sh
      - name: Apply distribution profile
        script: xcode-project use-profiles --project build-input/SheetMaster/SheetMaster.xcodeproj --archive-method app-store
      - name: Build signed IPA
        script: xcode-project build-ipa --project build-input/SheetMaster/SheetMaster.xcodeproj --scheme SheetMaster
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
